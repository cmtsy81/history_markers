<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seyahat Haritası</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  
  <link rel="stylesheet" href="map_style.css"> 
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="lang-selector">
        <button class="lang-btn active" data-lang="tr">TR</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="de">DE</button>
        <button class="lang-btn" data-lang="fr">FR</button>
      </div>
      <h1>🗺️ Seyahat</h1>
      <div class="filters">
        <div class="filter-group">
          <label for="searchInput">Ara</label>
          <input type="text" id="searchInput" placeholder="Lokasyon adı...">
        </div>
        <div class="filter-group">
          <label for="cityFilter">Şehir</label>
          <select id="cityFilter">
            <option value="">Tüm Şehirler</option>
          </select>
        </div>
        <div class="filter-group">
          <label for="categoryFilter">Kategori</label>
          <select id="categoryFilter">
            <option value="">Tüm Kategoriler</option>
          </select>
        </div>
      </div>
    </div>
    <div class="sidebar-content" id="locationList">
      <div class="loading">
        <div class="spinner"></div>
        <span>Yükleniyor...</span>
      </div>
    </div>
  </aside>

  <main class="main">
    <div id="map"></div>
    <div class="details-panel" id="detailsPanel">
      <div class="details-header">
        <h2 id="detailsTitle">-</h2>
        <button class="close-btn" onclick="closeDetails()">✕</button> 
      </div>
      <div class="gallery-placeholder" id="galleryPlaceholder">
        <img id="thumbnailImage" src="" alt="Lokasyon" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: none;">
        <div id="galleryPlaceholderContent" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
          <div class="gallery-placeholder-icon">📸</div>
          <div>Resim Galerisi</div>
        </div>
      </div>
      <div class="details-section">
        <h3>🎵 Ses</h3>
        <audio id="audioPlayer" style="width: 100%; margin-top: 8px;" controls>
          <source id="audioSource" src="" type="audio/mpeg">
          Tarayıcınız ses oynatmayı desteklemiyor.
        </audio>
      </div>
      <div class="details-section">
        <h3>Hakkında</h3>
        <p class="details-description" id="detailsDesc">-</p>
      </div>
      <div class="details-section">
        <h3>Bilgiler</h3>
        <div class="details-meta">
          <div class="meta-tag">
            <span>📍</span>
            <span id="detailsCity">-</span>
          </div>
          <div class="meta-tag">
            <span>🏷️</span>
            <span id="detailsCategory">-</span>
          </div>
        </div>
      </div>
      <div class="details-section">
        <h3>Yapım Yılı</h3>
        <p style="font-size: 16px; font-weight: 600; color: #0099ff; margin: 0;">
          <span id="detailsBuiltYear">-</span>
        </p>
      </div>
      <div class="details-section">
        <h3>Etiketler</h3>
        <div id="detailsTags" style="display: flex; flex-wrap: wrap; gap: 8px;">
          <span style="color: #999; font-size: 13px;">-</span>
        </div>
      </div>
    </div>
  </main>

  <script src="map_script.js"></script> 

</body>
</html>
